<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MONSTERS - إتمام الطلب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>* { font-family:'Cairo',sans-serif; }</style>
</head>
<body class="bg-gray-50 text-black" x-data="checkoutPage()" x-init="init()">

<nav class="bg-white border-b shadow-sm sticky top-0 z-50">
  <div class="max-w-5xl mx-auto px-4 flex items-center justify-between h-16">
    <a href="index.html" class="bg-black rounded-lg px-3 py-1 flex items-center gap-1">
      <span class="text-green-400 font-black text-xl">M</span>
      <span class="text-white font-black text-lg tracking-widest">ONSTERS</span>
    </a>
    <div class="flex items-center gap-2 text-sm text-gray-500 font-bold">
      <span class="text-green-500">السلة</span>
      <i class="fas fa-chevron-left text-xs"></i>
      <span class="text-black">الطلب</span>
      <i class="fas fa-chevron-left text-xs"></i>
      <span>التأكيد</span>
    </div>
  </div>
</nav>

<!-- FORM -->
<div x-show="!orderDone" class="max-w-5xl mx-auto px-4 py-10">
  <h1 class="text-3xl font-black mb-8">
    <i class="fas fa-map-marker-alt text-green-500 ml-2"></i>بيانات التوصيل
  </h1>

  <div class="grid grid-cols-1 lg:grid-cols-5 gap-8">
    <div class="lg:col-span-3 bg-white rounded-2xl p-6 shadow-sm border border-gray-100">

      <div class="mb-5">
        <label class="font-bold text-sm mb-2 block">الاسم الكامل *</label>
        <input x-model="form.name" type="text" placeholder="محمد أحمد"
          class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:border-green-400 text-sm"/>
        <p x-show="errors.name" class="text-red-500 text-xs mt-1">الاسم مطلوب</p>
      </div>

      <div class="mb-5">
        <label class="font-bold text-sm mb-2 block">رقم الموبايل *</label>
        <input x-model="form.phone" type="tel" placeholder="01xxxxxxxxx"
          class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:border-green-400 text-sm" dir="ltr"/>
        <p x-show="errors.phone" class="text-red-500 text-xs mt-1">رقم الهاتف مطلوب</p>
      </div>

      <div class="mb-5">
        <label class="font-bold text-sm mb-2 block">المحافظة *</label>
        <select x-model="form.gov"
          class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:border-green-400 text-sm bg-white">
          <option value="">اختر المحافظة</option>
          <template x-for="g in govs"><option :value="g" x-text="g"></option></template>
        </select>
        <p x-show="errors.gov" class="text-red-500 text-xs mt-1">المحافظة مطلوبة</p>
        <p x-show="form.gov" class="text-green-600 text-xs mt-2 font-bold">
          <i class="fas fa-truck ml-1"></i>
          تكلفة الشحن: EGP <span x-text="shippingCost"></span>
        </p>
      </div>

      <div class="mb-5">
        <label class="font-bold text-sm mb-2 block">العنوان بالتفصيل *</label>
        <textarea x-model="form.address" rows="3" placeholder="الشارع، الحي، المدينة..."
          class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:border-green-400 text-sm resize-none"></textarea>
        <p x-show="errors.address" class="text-red-500 text-xs mt-1">العنوان مطلوب</p>
      </div>

      <div class="mb-6">
        <label class="font-bold text-sm mb-2 block">ملاحظات (اختياري)</label>
        <textarea x-model="form.notes" rows="2" placeholder="أي ملاحظات للمندوب..."
          class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:border-green-400 text-sm resize-none"></textarea>
      </div>

      <div class="mb-6">
        <p class="font-black mb-3">طريقة الدفع:</p>
        <div class="flex gap-3">
          <label class="flex-1 border-2 rounded-xl p-3 cursor-pointer flex items-center gap-2 transition"
            :class="form.payment==='cod' ? 'border-green-500 bg-green-50' : 'border-gray-200'">
            <input type="radio" x-model="form.payment" value="cod" class="hidden"/>
            <i class="fas fa-money-bill text-green-500 text-xl"></i>
            <span class="font-bold text-sm">الدفع عند الاستلام</span>
          </label>
          <label class="flex-1 border-2 rounded-xl p-3 cursor-pointer flex items-center gap-2 transition"
            :class="form.payment==='transfer' ? 'border-green-500 bg-green-50' : 'border-gray-200'">
            <input type="radio" x-model="form.payment" value="transfer" class="hidden"/>
            <i class="fas fa-mobile-alt text-green-500 text-xl"></i>
            <span class="font-bold text-sm">تحويل إلكتروني</span>
          </label>
        </div>
      </div>

      <button @click="submitOrder()" :disabled="submitting"
        class="w-full bg-green-500 text-black font-black py-4 rounded-2xl hover:bg-green-600 transition text-xl flex items-center justify-center gap-2 disabled:opacity-60">
        <span x-show="!submitting"><i class="fas fa-check-circle ml-2"></i>تأكيد الطلب</span>
        <span x-show="submitting"><i class="fas fa-spinner fa-spin ml-2"></i>جارٍ الإرسال...</span>
      </button>

      <p x-show="submitError" class="text-red-500 text-sm mt-3 text-center font-bold" x-text="submitError"></p>
    </div>

    <div class="lg:col-span-2">
      <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 sticky top-24">
        <h2 class="font-black text-lg mb-4 border-b pb-3">ملخص الطلب</h2>
        <div class="space-y-3 max-h-72 overflow-y-auto mb-4">
          <template x-for="item in cart" :key="item._key||item.id">
            <div class="flex items-center gap-3">
              <img :src="item.image_url||'https://placehold.co/50x50/111/22c55e?text=M'"
                class="w-12 h-12 rounded-xl object-cover flex-shrink-0"/>
              <div class="flex-1 min-w-0">
                <p class="text-sm font-bold truncate" x-text="item.name"></p>
                <p class="text-xs text-gray-400"
                  x-text="(item.size?'مقاس '+item.size+' ':'')+('× '+(item.qty||1))"></p>
              </div>
              <span class="font-black text-sm"
                x-text="'EGP '+((item.finalPrice||item.price)*(item.qty||1))"></span>
            </div>
          </template>
        </div>
        <div class="border-t pt-4 space-y-2 text-sm">
          <div class="flex justify-between">
            <span class="text-gray-500">المجموع</span>
            <span class="font-bold" x-text="'EGP '+subtotal"></span>
          </div>
          <div class="flex justify-between">
            <span class="text-gray-500">الشحن</span>
            <span class="font-bold" x-text="form.gov ? ('EGP '+shippingCost) : 'حسب المحافظة'"></span>
          </div>
          <div class="flex justify-between text-lg font-black border-t pt-2">
            <span>الإجمالي</span>
            <span class="text-green-600" x-text="'EGP '+(subtotal+shippingCost)"></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- SUCCESS -->
<div x-show="orderDone" x-transition class="max-w-lg mx-auto px-4 py-20 text-center">
  <div class="bg-white rounded-3xl p-10 shadow-lg border border-gray-100">
    <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
      <i class="fas fa-check text-green-500 text-4xl"></i>
    </div>
    <h2 class="text-2xl font-black mb-2">تم استلام طلبك! 🎉</h2>
    <p class="text-gray-500 mb-4 text-sm">رقم الطلب:</p>
    <div class="bg-gray-50 rounded-xl px-6 py-3 inline-block mb-6">
      <span class="font-black text-xl text-green-600" x-text="orderNumber"></span>
    </div>
    <p class="text-gray-500 text-sm mb-8">سيتواصل معك فريقنا قريباً لتأكيد الطلب والشحن.</p>
    <a href="index.html"
      class="block w-full bg-black text-white font-black py-4 rounded-2xl hover:bg-green-500 hover:text-black transition">
      العودة للمتجر
    </a>
  </div>
</div>

<script>
const SHIPPING_RATES = {
  'القاهرة':70,'الجيزة':70,'الإسكندرية':90,'الدقهلية':90,
  'البحر الأحمر':155,'البحيرة':90,'الفيوم':105,'الغربية':90,
  'الإسماعيلية':95,'المنوفية':90,'المنيا':105,'القليوبية':90,
  'الوادي الجديد':155,'السويس':95,'أسوان':155,'أسيوط':105,
  'بني سويف':105,'بورسعيد':95,'دمياط':90,'الشرقية':90,
  'جنوب سيناء':155,'كفر الشيخ':90,'مطروح':155,'الأقصر':155,
  'قنا':155,'شمال سيناء':155,'سوهاج':105
};

function checkoutPage() {
  return {
    cart: [],
    form: { name:'', phone:'', gov:'', address:'', notes:'', payment:'cod' },
    errors: { name:false, phone:false, gov:false, address:false },
    govs: Object.keys(SHIPPING_RATES),
    submitting: false,
    submitError: '',
    orderDone: false,
    orderNumber: '',

    init() {
      try { this.cart = JSON.parse(localStorage.getItem('monsters_cart')||'[]'); } catch {}
      
      // إذا كانت السلة فارغة أثناء التجربة المحلية، نضع منتج وهمي لمنع توقف الاسكريبت
      if (!this.cart.length) {
        this.cart = [{ id: 'test_id', name: 'سويت شيرت وحوش - التجربة النشطة', price: 450, qty: 1, size: 'L' }];
      }
    },

    get subtotal() {
      return this.cart.reduce((s,i) => s+(i.finalPrice||i.price)*(i.qty||1), 0);
    },

    get shippingCost() {
      return SHIPPING_RATES[this.form.gov] || 0;
    },

    validate() {
      this.errors.name    = !this.form.name.trim();
      this.errors.phone   = !this.form.phone.trim();
      this.errors.gov     = !this.form.gov;
      this.errors.address = !this.form.address.trim();
      return !Object.values(this.errors).some(Boolean);
    },

    async submitOrder() {
      if (!this.validate()) return;
      this.submitting  = true;
      this.submitError = '';

      const shipping = this.shippingCost;
      const total    = this.subtotal + shipping;

      const itemsText = this.cart.map(i => `- ${i.name} (كمية: ${i.qty||1}) ${i.size ? '[مقاس: ' + i.size + ']' : ''}`).join('\n');
      const message = `👤 الاسم: ${this.form.name.trim()}\n📞 الهاتف: ${this.form.phone.trim()}\n📍 المحافظة: ${this.form.gov}\n🏠 العنوان: ${this.form.address.trim()}\n📝 ملاحظات: ${this.form.notes.trim() || 'لا يوجد'}\n\n📦 الطلبات:\n${itemsText}\n\n💰 الإجمالي: EGP ${total}`;

      // إرسال الإشعار المباشر للقناة الموضحة في لقطة الشاشة (77).png
      try {
        const encodedMsg = encodeURIComponent(message);
        const encodedTitle = encodeURIComponent('🛒 طلب جديد من الموقع!');
        const ntfyUrl = `https://ntfy.sh/monsters-orders-x7k2?m=${encodedMsg}&t=${encodedTitle}&p=high&x=shopping_bags,moneybag`;

        await fetch(ntfyUrl);
      } catch (err) {
        console.error('خطأ في إرسال ntfy:', err);
      }

      // إتمام الواجهة وعرض صفحة النجاح فوراً
      localStorage.removeItem('monsters_cart');
      this.orderNumber = 'M-' + Math.floor(100000 + Math.random() * 900000);
      this.orderDone   = true;
      this.submitting  = false;
    }
  };
}
</script>
</body>
</html>
