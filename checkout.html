<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MONSTERS - إتمام الطلب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>* { font-family:'Cairo',sans-serif; }</style>
</head>
<body class="bg-gray-50 text-black" x-data="checkoutPage()" x-init="init()">

<nav class="bg-white border-b shadow-sm sticky top-0 z-50">
  <div class="max-w-5xl mx-auto px-4 flex items-center justify-between h-16">
    <a href="index.html" class="bg-black rounded-lg px-3 py-1 flex items-center gap-1">
      <span class="text-green-400 font-black text-xl">M</span>
      <span class="text-white font-black text-lg tracking-widest">ONSTERS</span>
    </a>
  </div>
</nav>

<!-- FORM -->
<div x-show="!orderDone" class="max-w-5xl mx-auto px-4 py-10">
  <h1 class="text-3xl font-black mb-8">بيانات التوصيل</h1>

  <div class="grid grid-cols-1 lg:grid-cols-5 gap-8">
    <div class="lg:col-span-3 bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
      <div class="mb-5">
        <label class="font-bold text-sm mb-2 block">الاسم الكامل *</label>
        <input x-model="form.name" type="text" class="w-full border rounded-xl px-4 py-3 text-sm"/>
        <p x-show="errors.name" class="text-red-500 text-xs mt-1">الاسم مطلوب</p>
      </div>

      <div class="mb-5">
        <label class="font-bold text-sm mb-2 block">رقم الموبايل *</label>
        <input x-model="form.phone" type="tel" class="w-full border rounded-xl px-4 py-3 text-sm" dir="ltr"/>
        <p x-show="errors.phone" class="text-red-500 text-xs mt-1">رقم الهاتف مطلوب</p>
      </div>

      <div class="mb-5">
        <label class="font-bold text-sm mb-2 block">المحافظة *</label>
        <select x-model="form.gov" class="w-full border rounded-xl px-4 py-3 text-sm bg-white">
          <option value="">اختر المحافظة</option>
          <template x-for="g in govs"><option :value="g" x-text="g"></option></template>
        </select>
        <p x-show="errors.gov" class="text-red-500 text-xs mt-1">المحافظة مطلوبة</p>
      </div>

      <div class="mb-5">
        <label class="font-bold text-sm mb-2 block">العنوان بالتفصيل *</label>
        <textarea x-model="form.address" rows="3" class="w-full border rounded-xl px-4 py-3 text-sm resize-none"></textarea>
        <p x-show="errors.address" class="text-red-500 text-xs mt-1">العنوان مطلوب</p>
      </div>

      <button @click="submitOrder()" :disabled="submitting"
        class="w-full bg-green-500 text-black font-black py-4 rounded-2xl text-xl flex items-center justify-center gap-2">
        <span x-show="!submitting">تأكيد الطلب</span>
        <span x-show="submitting">جارٍ الإرسال...</span>
      </button>
    </div>

    <!-- SUMMARY -->
    <div class="lg:col-span-2">
      <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
        <h2 class="font-black text-lg mb-4">ملخص الطلب</h2>
        <template x-for="item in cart">
          <div class="flex justify-between text-sm mb-2">
            <span x-text="item.name + ' ×' + (item.qty||1)"></span>
            <span class="font-bold" x-text="'EGP '+(item.price*(item.qty||1))"></span>
          </div>
        </template>
      </div>
    </div>
  </div>
</div>

<!-- SUCCESS -->
<div x-show="orderDone" class="max-w-lg mx-auto px-4 py-20 text-center">
  <div class="bg-white rounded-3xl p-10 shadow-lg border">
    <h2 class="text-2xl font-black mb-2">تم استلام طلبك! 🎉</h2>
    <p class="text-gray-500 mb-4 text-sm">رقم الطلب: <span class="text-green-600 font-black" x-text="orderNumber"></span></p>
    <a href="index.html" class="block w-full bg-black text-white font-black py-4 rounded-2xl">العودة للمتجر</a>
  </div>
</div>

<!-- عنصر مخفي لإرسال الطلب من خلاله لتفادي شاشات الحظر وبدون فتح نافذة جديدة -->
<iframe id="ntfy_sender" name="ntfy_sender" style="display:none;"></iframe>

<script>
const SHIPPING_RATES = {'القاهرة':70,'الجيزة':70,'الإسكندرية':90,'الشرقية':90,'الدقهلية':90};

function checkoutPage() {
  return {
    cart: [],
    form: { name:'', phone:'', gov:'', address:'', notes:'', payment:'cod' },
    errors: { name:false, phone:false, gov:false, address:false },
    govs: Object.keys(SHIPPING_RATES),
    submitting: false,
    orderDone: false,
    orderNumber: '',

    init() {
      try { this.cart = JSON.parse(localStorage.getItem('monsters_cart')||'[]'); } catch {}
      if (!this.cart.length) {
        this.cart = [{ id: 'test', name: 'منتج تجريبي نشط', price: 450, qty: 1 }];
      }
    },

    async submitOrder() {
      this.errors.name = !this.form.name.trim();
      this.errors.phone = !this.form.phone.trim();
      this.errors.gov = !this.form.gov;
      this.errors.address = !this.form.address.trim();
      if (Object.values(this.errors).some(Boolean)) return;

      this.submitting = true;
      const itemsText = this.cart.map(i => `- ${i.name} (كمية: ${i.qty||1})`).join('\n');
      const message = `👤 الاسم: ${this.form.name}\n📞 الهاتف: ${this.form.phone}\n📍 المحافظة: ${this.form.gov}\n🏠 العنوان: ${this.form.address}\n\n📦 الطلبات:\n${itemsText}`;

      try {
        const encodedMsg = encodeURIComponent(message);
        const encodedTitle = encodeURIComponent('🛒 طلب جديد!');
        const ntfyUrl = `https://ntfy.sh/monsters-orders-x7k2?m=${encodedMsg}&t=${encodedTitle}&p=high`;

        // إرسال عبر الـ iframe المخفي عشان الإرسال يحصل تماماً في الخلفية
        document.getElementById('ntfy_sender').src = ntfyUrl;
      } catch (err) {}

      setTimeout(() => {
        localStorage.removeItem('monsters_cart');
        this.orderNumber = 'M-' + Math.floor(100000 + Math.random() * 900000);
        this.orderDone = true;
        this.submitting = false;
      }, 800); // تأخير بسيط لضمان خروج الأكشن للـ iframe
    }
  };
}
</script>
</body>
</html>
